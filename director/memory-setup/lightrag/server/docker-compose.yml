services:
  # ─── PostgreSQL (pgvector + Apache AGE) ───
  # Образ gzdaniel/postgres-for-rag включает все нужные расширения.
  # ВАЖНО: этот образ использует фиксированные кредсы rag/rag/rag.
  # Переменные POSTGRES_USER/PASSWORD/DB влияют только на initdb,
  # но образ уже создаёт пользователя rag при первом запуске.
  postgres:
    image: gzdaniel/postgres-for-rag:16.6
    container_name: lightrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - lightrag-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── LightRAG Server ───
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: lightrag-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      # Только localhost — наружу через Nginx Proxy Manager
      - "127.0.0.1:9621:9621"
    volumes:
      - rag_storage:/app/data/rag_storage
      - inputs:/app/data/inputs
    networks:
      - lightrag-net

volumes:
  postgres_data:
  rag_storage:
  inputs:

networks:
  lightrag-net:
    driver: bridge
