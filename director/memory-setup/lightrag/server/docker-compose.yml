services:
  # ─── PostgreSQL (pgvector + Apache AGE) ───
  # Образ gzdaniel/postgres-for-rag включает все нужные расширения.
  # POSTGRES_USER/DB зафиксированы образом как rag/rag — не переименовывай.
  # POSTGRES_PASSWORD — НЕ оставляй "rag": сгенерируй (openssl rand -hex 20) и подставь.
  # После первого запуска ПРОВЕРЬ, что новый пароль реально работает (см. server/install.sh) —
  # у некоторых сборок этого образа initdb может не применить переменную.
  postgres:
    image: gzdaniel/postgres-for-rag:16.6
    container_name: lightrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rag
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - lightrag-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── LightRAG Server ───
  lightrag:
    image: ghcr.io/hkuds/lightrag:1.4.9  # пин версии — проверь актуальный тег на ghcr.io/hkuds/lightrag перед обновлением
    container_name: lightrag-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      # Только localhost — наружу через Nginx Proxy Manager
      - "127.0.0.1:9621:9621"
    volumes:
      - rag_storage:/app/data/rag_storage
      - inputs:/app/data/inputs
    networks:
      - lightrag-net

volumes:
  postgres_data:
  rag_storage:
  inputs:

networks:
  lightrag-net:
    driver: bridge
